<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sonic sketch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="board">
    <div id="playhead"></div>
    <svg id="drawPreview"></svg>
  </div>

  <button id="recordBtn" title="Add a sound" aria-label="Add a sound">
    <span class="icon">+</span>
  </button>
  <div id="addMenu" class="add-menu" hidden>
    <button type="button" class="add-menu-option" data-action="record">● record</button>
    <button type="button" class="add-menu-option" data-action="upload">⇪ upload</button>
  </div>
  <input type="file" id="fileInput" accept="audio/*,.wav,.mp3" hidden />

  <button id="penBtn" class="tool-btn" title="Pen: draw a doodle or arrow" aria-label="Pen tool">
    <span class="icon">✎</span>
  </button>

  <button id="textBtn" class="tool-btn" title="Add a text box" aria-label="Text tool">
    <span class="icon">T</span>
  </button>

  <button id="playAllBtn" title="Play the entire canvas, left to right" aria-label="Play entire canvas">
    <span class="icon">▶</span>
  </button>

  <div id="timer" class="timer" hidden>0:00</div>

  <button id="shareBtn" class="tool-btn" title="Share this sketch" aria-label="Share this sketch">
    <span class="icon">↗</span>
  </button>
  <div id="sharePopup" class="add-menu share-popup" hidden>
    <div class="share-popup-label">anyone with this link can view and edit</div>
    <div class="share-popup-row">
      <input type="text" id="shareLink" readonly />
      <button type="button" id="copyLinkBtn">copy</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="script.js" defer></script>
</body>
</html>
