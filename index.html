<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sonic sketch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="board">
    <div id="canvas">
      <div id="playhead"></div>
    </div>
    <svg id="drawPreview"></svg>
  </div>

  <button id="recordBtn" title="Add a sound" aria-label="Add a sound">
    <span class="icon">
      <span class="wave-bar" style="height: 7px"></span>
      <span class="wave-bar" style="height: 13px"></span>
      <span class="wave-bar" style="height: 17px"></span>
      <span class="wave-bar" style="height: 11px"></span>
      <span class="wave-bar" style="height: 6px"></span>
    </span>
  </button>
  <div id="addMenu" class="add-menu" hidden>
    <button type="button" class="add-menu-option" data-action="record">● record</button>
    <button type="button" class="add-menu-option" data-action="upload">⇪ upload</button>
  </div>
  <input type="file" id="fileInput" accept="audio/*,.wav,.mp3" hidden />

  <button id="penBtn" class="tool-btn" title="Pen: draw a doodle or arrow" aria-label="Pen tool">
    <span class="icon">✎</span>
  </button>

  <button id="textBtn" class="tool-btn" title="Add a text box" aria-label="Text tool">
    <span class="icon">T</span>
  </button>

  <button id="imageBtn" class="tool-btn" title="Upload an image" aria-label="Upload an image">
    <span class="icon image-icon"></span>
  </button>
  <input type="file" id="imageFileInput" accept="image/*" hidden />

  <button id="playAllBtn" title="Play the entire canvas, left to right" aria-label="Play entire canvas">
    <span class="icon">▶</span>
  </button>

  <div id="timer" class="timer" hidden>0:00</div>

  <button id="shareBtn" class="tool-btn" title="Share this sketch" aria-label="Share this sketch">
    <span class="icon">↗</span>
  </button>
  <div id="sharePopup" class="add-menu share-popup" hidden>
    <div id="shareNameRow" class="share-popup-row" hidden>
      <input type="text" id="shareNameInput" placeholder="name this sketch (optional)" />
    </div>
    <button type="button" id="createLinkBtn" class="add-menu-option" hidden>create link</button>
    <div id="shareLinkSection" hidden>
      <div class="share-popup-label">anyone with this link can view and edit</div>
      <div class="share-popup-row">
        <input type="text" id="shareLink" readonly />
        <button type="button" id="copyLinkBtn">copy</button>
      </div>
    </div>
  </div>

  <button id="sketchbookTab" class="sketchbook-tab" title="Sketchbook" aria-label="Sketchbook">+ sketchbook</button>

  <div id="createBookPopup" class="add-menu book-popup" hidden>
    <div class="share-popup-label">name this sketchbook (optional)</div>
    <div class="share-popup-row">
      <input type="text" id="bookNameInput" placeholder="sketchbook name" />
    </div>
    <button type="button" id="createBookBtn" class="add-menu-option">create sketchbook</button>
  </div>

  <div id="tray" class="tray" hidden>
    <div class="share-popup-row tray-link-row">
      <input type="text" id="trayLinkInput" readonly />
      <button type="button" id="trayCopyBtn">copy</button>
    </div>
    <div id="trayList" class="tray-list"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="script.js" defer></script>
</body>
</html>
