<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sonic sketch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="board">
    <div id="playhead"></div>
    <svg id="drawPreview"></svg>
  </div>

  <button id="recordBtn" title="Add a sound" aria-label="Add a sound">
    <span class="icon">+</span>
  </button>
  <div id="addMenu" class="add-menu" hidden>
    <button type="button" class="add-menu-option" data-action="record">● record</button>
    <button type="button" class="add-menu-option" data-action="upload">⇪ upload</button>
  </div>
  <input type="file" id="fileInput" accept="audio/*,.wav,.mp3" hidden />

  <button id="penBtn" class="tool-btn" title="Pen: draw a doodle or arrow" aria-label="Pen tool">
    <span class="icon">✎</span>
  </button>

  <button id="playAllBtn" title="Play the entire canvas, left to right" aria-label="Play entire canvas">
    <span class="icon">▶</span>
  </button>

  <div id="timer" class="timer" hidden>0:00</div>

  <div id="hint" class="hint">
    click <strong>+</strong> to record or upload a sound &middot; drag a sound to move it &middot;
    click it to play &middot; click the note below it to type &middot;
    <strong>✎</strong> draw a doodle, then drag/delete/duplicate it like a sound &middot;
    <strong>▶</strong> plays the whole canvas &middot;
    drag empty canvas to select multiple &middot; delete key removes selection
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="script.js" defer></script>
</body>
</html>
